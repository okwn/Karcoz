<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice — KARÇÖZ</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .practice-layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; min-height: calc(100vh - 120px); }
    .practice-sidebar { background: var(--surface); border-radius: 12px; padding: 20px; }
    .practice-sidebar h3 { font-size: 14px; font-weight: 600; color: var(--dim); margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 0.05em; }
    .practice-nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; transition: all 0.15s; margin-bottom: 4px; cursor: pointer; }
    .practice-nav-item:hover { background: var(--surface2); }
    .practice-nav-item.active { background: var(--accent); color: white; }
    .practice-nav-item svg { width: 18px; height: 18px; }
    .practice-content { padding: 0; }
    .generate-card { background: var(--surface); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .generate-card h2 { margin: 0 0 16px 0; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 500; color: var(--dim); }
    .form-group select, .form-group input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
    .generate-btn { margin-top: 16px; padding: 12px 24px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.15s; }
    .generate-btn:hover { opacity: 0.85; }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .question-card { background: var(--surface); border-radius: 12px; padding: 24px; margin-bottom: 16px; position: relative; }
    .question-meta { display: flex; gap: 12px; margin-bottom: 12px; }
    .question-tag { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: var(--surface2); color: var(--dim); }
    .question-text { font-size: 16px; font-weight: 500; margin: 0 0 16px 0; line-height: 1.5; }
    .options-list { display: flex; flex-direction: column; gap: 8px; }
    .option-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: all 0.15s; }
    .option-item:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.05); }
    .option-item.selected { border-color: var(--accent); background: rgba(99, 102, 241, 0.1); }
    .option-item.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
    .option-item.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    .option-label { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--surface2); font-weight: 600; font-size: 13px; flex-shrink: 0; }
    .option-item.selected .option-label { background: var(--accent); color: white; }
    .option-item.correct .option-label { background: #22c55e; color: white; }
    .option-item.wrong .option-label { background: #ef4444; color: white; }
    .explanation-box { margin-top: 16px; padding: 16px; border-radius: 8px; background: rgba(99, 102, 241, 0.08); border-left: 3px solid var(--accent); }
    .explanation-box h4 { margin: 0 0 8px 0; font-size: 13px; font-weight: 600; color: var(--accent); }
    .explanation-box p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--dim); }
    .score-card { background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 16px; padding: 32px; text-align: center; color: white; margin-bottom: 20px; }
    .score-card .score-value { font-size: 56px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
    .score-card .score-label { font-size: 14px; opacity: 0.8; margin-bottom: 16px; }
    .score-card .score-detail { font-size: 14px; opacity: 0.9; }
    .nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .nav-header h1 { font-size: 24px; font-weight: 700; margin: 0; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-header h2 { font-size: 18px; font-weight: 600; margin: 0; }
    .sets-list { display: flex; flex-direction: column; gap: 10px; }
    .set-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); border-radius: 10px; cursor: pointer; transition: all 0.15s; text-decoration: none; color: inherit; }
    .set-item:hover { background: var(--surface2); }
    .set-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .set-info { flex: 1; }
    .set-info h4 { margin: 0 0 2px 0; font-size: 14px; font-weight: 600; }
    .set-info p { margin: 0; font-size: 12px; color: var(--dim); }
    .set-meta { display: flex; gap: 8px; align-items: center; }
    .meta-badge { font-size: 11px; padding: 3px 7px; border-radius: 4px; background: var(--surface2); color: var(--dim); }
    .difficulty-easy { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .difficulty-medium { background: rgba(234, 179, 8, 0.15); color: #eab308; }
    .difficulty-hard { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--dim); }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }
    .empty-state h3 { margin: 0 0 8px 0; font-size: 16px; font-weight: 600; color: var(--text); }
    .empty-state p { margin: 0; font-size: 14px; }
    .attempt-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .attempt-progress { font-size: 13px; color: var(--dim); }
    .attempt-btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.15s; border: none; }
    .attempt-btn.prev { background: var(--surface); color: var(--text); }
    .attempt-btn.next { background: var(--accent); color: white; }
    .attempt-btn.next:disabled { opacity: 0.5; cursor: not-allowed; }
    .quiz-count-badge { position: absolute; top: 16px; right: 16px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: var(--surface2); color: var(--dim); }
    .recommended-list { display: flex; flex-direction: column; gap: 12px; }
    .recommended-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border-radius: 10px; }
    .recommended-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(99, 102, 241, 0.15); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .recommended-info { flex: 1; }
    .recommended-info h4 { margin: 0 0 2px 0; font-size: 14px; font-weight: 600; }
    .recommended-info p { margin: 0; font-size: 12px; color: var(--dim); }
    .recommended-btn { padding: 8px 14px; border-radius: 6px; background: var(--accent); color: white; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
    .recommended-btn:hover { opacity: 0.85; }
    .result-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .result-score-circle { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: white; }
    .result-score-circle.high { background: #22c55e; }
    .result-score-circle.medium { background: #eab308; }
    .result-score-circle.low { background: #ef4444; }
    .result-summary h2 { margin: 0 0 4px 0; font-size: 20px; }
    .result-summary p { margin: 0; font-size: 13px; color: var(--dim); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav__logo">KARÇÖZ</div>
    <div class="nav__links">
      <a href="/dashboard" class="nav__link">Dashboard</a>
      <a href="/history" class="nav__link">History</a>
      <a href="/weak-topics" class="nav__link">Weak Topics</a>
      <a href="/practice" class="nav__link nav__link--active">Practice</a>
    </div>
  </nav>

  <main class="main">
    <div id="loading" class="loading">
      <div class="loading__spinner"></div>
      <span>Loading...</span>
    </div>

    <div id="error" class="error" style="display:none">
      <p id="error-msg"></p>
      <button class="btn btn--primary" onclick="init()">Retry</button>
    </div>

    <div id="content" style="display:none">
      <!-- Practice Sets View -->
    <div id="view-sets" class="practice-layout">
      <aside class="practice-sidebar">
        <h3>Practice</h3>
        <div class="practice-nav-item active" onclick="showView('generate')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Generate
        </div>
        <div class="practice-nav-item" onclick="showView('sets')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
          My Sets
        </div>
        <div class="practice-nav-item" onclick="showView('recommended')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Recommended
        </div>
      </aside>
      <div class="practice-content">
        <!-- Generate View -->
        <div id="view-generate" class="view-section">
          <div class="generate-card">
            <h2>Generate Practice Set</h2>
            <div class="form-grid">
              <div class="form-group">
                <label>Topic</label>
                <select id="gen-topic">
                  <option value="Mathematics">Mathematics</option>
                  <option value="Physics">Physics</option>
                  <option value="Chemistry">Chemistry</option>
                  <option value="Biology">Biology</option>
                  <option value="Geography">Geography</option>
                  <option value="History">History</option>
                  <option value="ComputerScience">Computer Science</option>
                </select>
              </div>
              <div class="form-group">
                <label>Difficulty</label>
                <select id="gen-difficulty">
                  <option value="easy">Easy</option>
                  <option value="medium" selected>Medium</option>
                  <option value="hard">Hard</option>
                </select>
              </div>
              <div class="form-group">
                <label>Language</label>
                <select id="gen-language">
                  <option value="en">English</option>
                  <option value="tr">Türkçe</option>
                </select>
              </div>
              <div class="form-group">
                <label>Number of Questions</label>
                <input type="number" id="gen-count" value="5" min="1" max="20">
              </div>
            </div>
            <button class="generate-btn" id="gen-btn" onclick="generatePractice()">Generate Practice Set</button>
          </div>
          <div id="gen-result"></div>
        </div>

        <!-- My Sets View -->
        <div id="view-sets-list" class="view-section" style="display:none">
          <div class="section-header">
            <h2>My Practice Sets</h2>
          </div>
          <div id="sets-list" class="sets-list"></div>
        </div>

        <!-- Recommended View -->
        <div id="view-recommended" class="view-section" style="display:none">
          <div class="section-header">
            <h2>Recommended for You</h2>
          </div>
          <div id="recommended-list" class="recommended-list"></div>
        </div>

        <!-- Quiz View -->
        <div id="view-quiz" class="view-section" style="display:none">
          <div id="quiz-content"></div>
        </div>

        <!-- Result View -->
        <div id="view-result" class="view-section" style="display:none">
          <div id="result-content"></div>
        </div>
      </div>
    </div>
    </div>
  </main>

  <script>
    const API = 'http://localhost:8100/api';
    let currentSetId = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let currentAnswers = [];

    async function init() {
      showLoading();
      try {
        await loadRecommended();
        showView('generate');
        showContent();
      } catch (err) {
        showError(err.message);
      }
    }

    function showLoading() { document.getElementById('loading').style.display = 'flex'; document.getElementById('error').style.display = 'none'; document.getElementById('content').style.display = 'none'; }
    function showError(msg) { document.getElementById('loading').style.display = 'none'; document.getElementById('error').style.display = 'block'; document.getElementById('error-msg').textContent = msg; }
    function showContent() { document.getElementById('loading').style.display = 'none'; document.getElementById('error').style.display = 'none'; document.getElementById('content').style.display = 'block'; }

    function showView(view) {
      document.querySelectorAll('.view-section').forEach(v => v.style.display = 'none');
      document.querySelectorAll('.practice-nav-item').forEach(n => n.classList.remove('active'));
      if (view === 'generate') { document.getElementById('view-generate').style.display = 'block'; document.querySelector('.practice-nav-item:nth-child(1)').classList.add('active'); }
      else if (view === 'sets') { document.getElementById('view-sets-list').style.display = 'block'; document.querySelector('.practice-nav-item:nth-child(2)').classList.add('active'); loadSets(); }
      else if (view === 'recommended') { document.getElementById('view-recommended').style.display = 'block'; document.querySelector('.practice-nav-item:nth-child(3)').classList.add('active'); }
      else if (view === 'quiz') { document.getElementById('view-quiz').style.display = 'block'; }
      else if (view === 'result') { document.getElementById('view-result').style.display = 'block'; }
    }

    async function generatePractice() {
      const btn = document.getElementById('gen-btn');
      btn.disabled = true; btn.textContent = 'Generating...';
      const resultDiv = document.getElementById('gen-result');
      resultDiv.innerHTML = '';

      try {
        const res = await fetch(`${API}/practice/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic: document.getElementById('gen-topic').value,
            difficulty: document.getElementById('gen-difficulty').value,
            language: document.getElementById('gen-language').value,
            count: parseInt(document.getElementById('gen-count').value, 10),
            includeExplanations: true,
          }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        currentSetId = data.practiceSetId;
        currentQuestions = data.questions;
        currentIndex = 0;
        currentAnswers = [];

        resultDiv.innerHTML = `<div class="question-card">
          <div class="quiz-count-badge">${currentQuestions.length} questions</div>
          <p style="color:var(--dim);margin:0 0 16px 0">Practice set generated! Test your knowledge.</p>
          <button class="generate-btn" onclick="startQuiz()">Start Quiz</button>
        </div>`;
      } catch (err) {
        resultDiv.innerHTML = `<div class="error" style="padding:16px;border-radius:8px;margin-top:12px"><p>${err.message}</p></div>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Generate Practice Set';
      }
    }

    function startQuiz() { showView('quiz'); renderQuestion(); }

    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      const quizContent = document.getElementById('quiz-content');
      quizContent.innerHTML = `
        <div class="attempt-nav">
          <span class="attempt-progress">Question ${currentIndex + 1} of ${currentQuestions.length}</span>
          <button class="attempt-btn prev" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>Previous</button>
          <button class="attempt-btn next" onclick="nextQuestion()">${currentIndex === currentQuestions.length - 1 ? 'Finish' : 'Next'}</button>
        </div>
        <div class="question-card">
          <div class="quiz-count-badge">${q.difficulty}</div>
          <div class="question-meta">
            <span class="question-tag">${q.topic}</span>
          </div>
          <p class="question-text">${escapeHtml(q.questionText)}</p>
          <div class="options-list">
            ${(q.options || []).map((opt, i) => `<div class="option-item" data-index="${i}" onclick="selectOption(${i}, '${opt.label}')">
              <span class="option-label">${opt.label}</span>
              <span>${escapeHtml(opt.value)}</span>
            </div>`).join('')}
          </div>
        </div>`;
    }

    function selectOption(index, label) {
      currentAnswers[currentIndex] = { questionId: currentQuestions[currentIndex].questionText, answer: label };
      document.querySelectorAll('.option-item').forEach((el, i) => {
        el.classList.toggle('selected', i === index);
      });
    }

    function nextQuestion() {
      if (currentAnswers[currentIndex] === undefined) {
        alert('Please select an answer first');
        return;
      }
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitAttempt();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    }

    async function submitAttempt() {
      const quizContent = document.getElementById('quiz-content');
      quizContent.innerHTML = '<div class="loading" style="display:flex"><div class="loading__spinner"></div><span>Submitting...</span></div>';

      try {
        const res = await fetch(`${API}/practice/sets/${currentSetId}/attempt`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers: currentAnswers, timeSpentMs: 60000 }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        showResult(data);
      } catch (err) {
        quizContent.innerHTML = `<div class="error" style="padding:16px"><p>${err.message}</p></div>`;
      }
    }

    function showResult(data) {
      showView('result');
      const scoreClass = data.score >= 80 ? 'high' : data.score >= 50 ? 'medium' : 'low';
      const scoreMessage = data.score >= 80 ? 'Excellent work!' : data.score >= 50 ? 'Good effort!' : 'Keep practicing!';

      const resultContent = document.getElementById('result-content');
      resultContent.innerHTML = `
        <div class="score-card">
          <div class="score-value">${Math.round(data.score)}%</div>
          <div class="score-label">${scoreMessage}</div>
          <div class="score-detail">${data.correctCount} of ${data.totalQuestions} correct</div>
        </div>
        <div class="section-header">
          <h2>Review Answers</h2>
        </div>
        <div id="results-list"></div>
        <button class="generate-btn" style="margin-top:20px" onclick="init()">Back to Practice</button>
      `;

      const resultsList = document.getElementById('results-list');
      resultsList.innerHTML = data.results.map((r, i) => {
        const q = currentQuestions[i];
        return `<div class="question-card" style="margin-bottom:12px">
          <div class="result-header">
            <div class="result-score-circle ${r.isCorrect ? 'high' : 'low'}">${r.isCorrect ? '✓' : '✗'}</div>
            <div class="result-summary">
              <h2>${r.isCorrect ? 'Correct' : 'Incorrect'}</h2>
              <p>Your answer: ${r.userAnswer} · Correct: ${r.correctAnswer}</p>
            </div>
          </div>
          ${q.explanation ? `<div class="explanation-box"><h4>Explanation</h4><p>${escapeHtml(q.explanation)}</p></div>` : ''}
        </div>`;
      }).join('');
    }

    async function loadSets() {
      try {
        const res = await fetch(`${API}/practice/sets`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const list = document.getElementById('sets-list');
        if (!data.data || data.data.length === 0) {
          list.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg><h3>No practice sets yet</h3><p>Generate your first practice set to get started</p></div>';
        } else {
          list.innerHTML = data.data.map(s => `<div class="set-item" onclick="loadSet('${s.id}')">
            <div class="set-icon">📝</div>
            <div class="set-info">
              <h4>${escapeHtml(s.topic)}</h4>
              <p>${s.questionCount} questions · ${s.attemptCount} attempts · ${new Date(s.createdAt).toLocaleDateString()}</p>
            </div>
            <div class="set-meta">
              <span class="meta-badge difficulty-${s.difficulty}">${s.difficulty}</span>
              <span class="meta-badge">${s.language}</span>
            </div>
          </div>`).join('');
        }
      } catch (err) { console.error(err); }
    }

    async function loadSet(id) {
      try {
        const res = await fetch(`${API}/practice/sets/${id}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentSetId = id;
        currentQuestions = data.questions.map((q, i) => ({ ...q, questionText: q.questionText }));
        currentIndex = 0;
        currentAnswers = [];
        showView('quiz');
        renderQuestion();
      } catch (err) { alert(err.message); }
    }

    async function loadRecommended() {
      try {
        const res = await fetch(`${API}/practice/recommended?count=5`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const list = document.getElementById('recommended-list');
        if (!data.data || data.data.length === 0) {
          list.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><h3>No recommendations yet</h3><p>Solve more questions to get personalized recommendations</p></div>';
        } else {
          list.innerHTML = data.data.map(r => `<div class="recommended-item">
            <div class="recommended-icon">📚</div>
            <div class="recommended-info">
              <h4>${escapeHtml(r.topic)}</h4>
              <p>${r.reason} · ${r.questionCount} questions · ${r.difficulty}</p>
            </div>
            <button class="recommended-btn" onclick="generateForTopic('${r.topic}', ${r.questionCount}, '${r.difficulty}')">Practice</button>
          </div>`).join('');
        }
      } catch (err) { console.error(err); }
    }

    function generateForTopic(topic, count, difficulty) {
      document.getElementById('gen-topic').value = topic;
      document.getElementById('gen-count').value = count;
      document.getElementById('gen-difficulty').value = difficulty;
      showView('generate');
      generatePractice();
    }

    function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    window.init = init;
    window.showView = showView;
    window.generatePractice = generatePractice;
    window.startQuiz = startQuiz;
    window.renderQuestion = renderQuestion;
    window.selectOption = selectOption;
    window.nextQuestion = nextQuestion;
    window.prevQuestion = prevQuestion;
    window.submitAttempt = submitAttempt;
    window.showResult = showResult;
    window.loadSets = loadSets;
    window.loadSet = loadSet;
    window.loadRecommended = loadRecommended;
    window.generateForTopic = generateForTopic;
    init();
  </script>
</body>
</html>
