<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — KARÇÖZ</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav__logo">KARÇÖZ</div>
    <div class="nav__links">
      <a href="/dashboard" class="nav__link nav__link--active">Dashboard</a>
      <a href="/history" class="nav__link">History</a>
      <a href="/weak-topics" class="nav__link">Weak Topics</a>
      <a href="/settings" class="nav__link">Settings</a>
    </div>
    <div class="nav__auth">
      <a href="/logout" class="nav__link" id="auth-indicator">Logout</a>
    </div>
  </nav>

  <main class="main">
    <header class="page-header">
      <h1 class="page-title">Overview</h1>
      <p class="page-subtitle">Your study progress at a glance</p>
    </header>

    <div id="loading" class="loading">
      <div class="loading__spinner"></div>
      <span>Loading...</span>
    </div>

    <div id="error" class="error" style="display:none">
      <p id="error-msg"></p>
      <button class="btn btn--primary" onclick="loadOverview()">Retry</button>
    </div>

    <div id="content" style="display:none">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-card__label">Total Questions</div>
          <div class="kpi-card__value" id="kpi-total">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card__label">This Week</div>
          <div class="kpi-card__value" id="kpi-week">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card__label">Saved</div>
          <div class="kpi-card__value" id="kpi-saved">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card__label">Avg Confidence</div>
          <div class="kpi-card__value" id="kpi-avg-conf">—</div>
        </div>
      </div>

      <section class="section">
        <h2 class="section__title">By Topic</h2>
        <div class="bar-list" id="by-topic"></div>
      </section>

      <section class="section">
        <h2 class="section__title">By Type</h2>
        <div class="bar-list" id="by-type"></div>
      </section>

      <section class="section">
        <h2 class="section__title">Recent Activity</h2>
        <div class="recent-list" id="recent-list"></div>
      </section>
    </div>
  </main>

  <script>
    const API = 'http://localhost:8100/api';
    async function loadOverview() {
      // Auth check
      try {
        const sessionRes = await fetch(`${API}/auth/session`, { credentials: 'include' });
        if (sessionRes.status === 401) { window.location.href = '/login'; return; }
      } catch { window.location.href = '/login'; return; }
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const content = document.getElementById('content');
      loading.style.display = 'flex'; error.style.display = 'none'; content.style.display = 'none';
      try {
        const res = await fetch(`${API}/analytics/overview`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        document.getElementById('kpi-total').textContent = data.total ?? 0;
        document.getElementById('kpi-week').textContent = data.thisWeek ?? 0;
        document.getElementById('kpi-saved').textContent = data.saved ?? 0;
        document.getElementById('kpi-avg-conf').textContent = data.avgConfidence ? Math.round(data.avgConfidence * 100) + '%' : '—';
        renderBarList('by-topic', data.byTopic ?? [], 'topic', 'count');
        renderBarList('by-type', data.byType ?? [], 'type', 'count');
        renderRecent(data.recentHistory ?? []);
        loading.style.display = 'none'; content.style.display = 'block';
      } catch (err) {
        loading.style.display = 'none';
        document.getElementById('error-msg').textContent = err.message;
        error.style.display = 'block';
      }
    }
    function renderBarList(id, items, labelKey, valueKey) {
      const el = document.getElementById(id);
      if (!items.length) { el.innerHTML = '<p class="empty">No data yet</p>'; return; }
      const max = Math.max(...items.map(i => i[valueKey]), 1);
      el.innerHTML = items.map(item => `<div class="bar-item"><span class="bar-item__label">${escapeHtml(item[labelKey] ?? '—')}</span><div class="bar-item__track"><div class="bar-item__fill" style="width:${(item[valueKey] / max) * 100}%"></div></div><span class="bar-item__value">${item[valueKey]}</span></div>`).join('');
    }
    function renderRecent(items) {
      const el = document.getElementById('recent-list');
      if (!items.length) { el.innerHTML = '<p class="empty">No recent activity</p>'; return; }
      el.innerHTML = items.map(item => `<a href="/questions/${item.id}" class="recent-item"><span class="recent-item__topic">${escapeHtml(item.topic ?? '—')}</span><span class="recent-item__conf">${item.confidence ? Math.round(item.confidence * 100) + '%' : '—'}</span><span class="recent-item__type">${escapeHtml(item.type ?? '—')}</span><span class="recent-item__time">${formatTime(item.time)}</span></a>`).join('');
    }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function formatTime(ts) { return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    window.loadOverview = loadOverview;
    loadOverview();
  </script>
</body>
</html>
