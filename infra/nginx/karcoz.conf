upstream karcoz_api {
    server 127.0.0.1:8132;
    keepalive 64;
}

upstream karcoz_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

# ── HTTP Server (redirects to HTTPS) ─────────────────────────────
server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS Server (TLS) ───────────────────────────────────────────
# Replace 'yourdomain.com' with your actual domain before deploying.
# After running certbot, it will auto-configure this block.
server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # TLS certificate (issued by certbot)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS — only set after TLS is confirmed working
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Body / Upload limits ─────────────────────────────────────
    # Aligns with Fastify bodyLimit (20MB)
    client_max_body_size 20M;
    client_body_buffer_size 1M;

    # ── API ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://karcoz_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts — AI solve requests can take 10–30s
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_busy_buffers_size 8k;
    }

    # ── Dashboard (SPA) ─────────────────────────────────────────
    location / {
        proxy_pass http://karcoz_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SPA fallback — dashboard handles routing
        proxy_intercept_errors off;
    }

    # ── Static asset caching ────────────────────────────────────
    # Cache static assets served by the web dashboard to reduce backend load.
    # Assets are fingerprinted (hash in filename) so long cache is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://karcoz_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Cache for 1 year (assets include content hash in filename)
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Certbot / Let's Encrypt ───────────────────────────────────────
# Certbot will auto-configure this section when you run:
#   sudo certbot --nginx -d yourdomain.com
#
# After certbot runs, replace 'yourdomain.com' in the HTTPS block above
# with your actual domain name. Certbot handles certificate renewal automatically.
#
# Renewal verification:
#   sudo certbot renew --dry-run
#   sudo systemctl list-timers | grep certbot
