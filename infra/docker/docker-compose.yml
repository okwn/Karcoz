# KARÇÖZ — Docker Compose (Development)
# Usage: docker compose -f infra/docker/docker-compose.yml up

name: karcoz

services:
  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/Dockerfile.api
    container_name: karcoz_api
    ports:
      - "${API_PORT:-8132}:8000"
    environment:
      - DATABASE_URL=postgresql://karcoz:${DB_PASSWORD}@db:5432/karcoz_db
      - REDIS_URL=redis://redis:6379/0
      - NODE_ENV=development
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure
    volumes:
      - ./uploads:/app/uploads

  web:
    build:
      context: ../apps/web-dashboard
      dockerfile: ../../infra/docker/Dockerfile.web
    container_name: karcoz_web
    ports:
      - "${WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: on-failure

  # Worker service removed — apps/worker/ is empty (no background jobs currently required)
  # Re-add when background job processing is implemented.

  telegram-bot:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/Dockerfile.telegram-bot
    container_name: karcoz_telegram
    environment:
      - DATABASE_URL=postgresql://karcoz:${DB_PASSWORD}@db:5432/karcoz_db
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3100}
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: on-failure

  db:
    image: postgres:16-alpine
    container_name: karcoz_db
    environment:
      POSTGRES_DB: karcoz_db
      POSTGRES_USER: karcoz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - karcoz_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karcoz -d karcoz_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: karcoz_redis
    command: redis-server --appendonly yes
    volumes:
      - karcoz_redisdata:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  karcoz_pgdata:
  karcoz_redisdata:
